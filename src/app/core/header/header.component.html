<header
  [attr.data-bs-theme]="
    isSmallScreen()
      ? ''
      : (headerThemeMode() === 'dark' ? 'dark' : 'light')
  "
  [ngClass]="{
    'bg-light': headerThemeMode() !== 'dark' && isScrolled(),
    'bg-dark': headerThemeMode() === 'dark' && isScrolled(),
    'is-mobile-menu-open': isMenuOpen()
  }"
  class="navbar navbar-expand-lg fixed-top py-0 mb-4"
>
  <div class="container-fluid header-inner">

    <!-- ========================================================= -->
    <!-- LOGO -->
    <!-- Hidden automatically when mobile menu is open -->
    <!-- ========================================================= -->

    <a class="navbar-brand pe-sm-3" routerLink="/">
      @if (headerThemeMode() !== 'dark') {
        <img
          alt="Logo"
          src="/logo2.svg"
          id="navbar-logo"
          style="width: 9rem; height: 7rem; object-fit: cover"
        />
      } @else {
        <img
          alt="Logo"
          src="/logo.svg"
          id="navbar-logo"
          style="width: 9rem; height: 7rem; object-fit: cover"
        />
      }
    </a>


    <!-- ========================================================= -->
    <!-- ACTIONS -->
    <!-- Donate + Contact + Theme -->
    <!-- Hidden entirely when mobile menu is open -->
    <!-- ========================================================= -->

    <div class="header-actions">

      <!-- Donate -->
      <button
        type="button"
        class="btn btn-lg btn-outline-secondary header-donate-btn"
        (click)="openDonate()"
        aria-label="Donate"
      >
        <i class="bi bi-heart me-2"></i>
        <span>Donate</span>
      </button>


      <!-- Contact us — desktop/tablet only -->
      <a
        class="btn btn-sm btn-primary btn-sm fs-sm d-none d-md-inline-flex ms-2"
        routerLink="/contact-us"
        rel="noopener"
      >
        <i class="ai-user-plus fs-xl me-2 ms-n1"></i>
        Contact us
      </a>


      <!-- Theme toggle -->
      <button
        type="button"
        class="theme-toggle d-inline-flex ms-2"
        (click)="themeService.toggleTheme()"
        [attr.aria-pressed]="themeService.theme() === 'dark'"
        [attr.aria-label]="
          themeService.theme() === 'dark'
            ? 'Switch to light mode'
            : 'Switch to dark mode'
        "
      >
        <span
          class="theme-toggle-icons"
          [class.is-dark]="themeService.theme() === 'dark'"
        >
          <i class="ai-sun fs-lg theme-toggle-sun"></i>
          <i class="ai-moon fs-lg theme-toggle-moon"></i>
        </span>
      </button>

    </div>


    <!-- ========================================================= -->
    <!-- MOBILE TOGGLE -->
    <!-- Always remains visible -->
    <!-- ========================================================= -->

    <button
      class="navbar-toggler ms-2"
      type="button"
      (click)="toggleMobileMenu()"
      [attr.aria-expanded]="isMenuOpen()"
      aria-controls="navbarNav"
      [attr.aria-label]="
        isMenuOpen()
          ? 'Close navigation'
          : 'Toggle navigation'
      "
    >
      <span class="navbar-toggler-icon"></span>
    </button>


    <!-- ========================================================= -->
    <!-- NAVIGATION -->
    <!-- ========================================================= -->

    <nav
      class="collapse navbar-collapse"
      id="navbarNav"
      [class.show]="isMenuOpen()"
    >

      <ul
        class="navbar-nav navbar-nav-scroll me-auto"
        style="--ar-scroll-height: 520px;"
      >

        <!-- Home -->
        <li class="nav-item me-0 pe-1">
          <a
            class="nav-link"
            routerLink="/home"
            [routerLinkActiveOptions]="{exact:true}"
            routerLinkActive="active"
            (click)="closeMobileMenu()"
          >
            Home
          </a>
        </li>


        <!-- About -->
        <li class="nav-item">
          <a
            class="nav-link"
            routerLink="/about"
            routerLinkActive="active"
            (click)="closeMobileMenu()"
          >
            About US
          </a>
        </li>


        <!-- ===================================================== -->
        <!-- OUR WORK -->
        <!-- ===================================================== -->

        <li
          class="nav-item dropdown"
          [class.show]="isDropdownOpen('our-work')"
        >
          <a
            class="nav-link dropdown-toggle"
            role="button"
            [attr.aria-expanded]="isDropdownOpen('our-work')"
            (click)="toggleDropdown('our-work', $event)"
          >
            Our Work
          </a>

          <ul
            class="dropdown-menu"
            [class.show]="isDropdownOpen('our-work')"
          >
            <li>
              <a
                routerLink="/projects"
                routerLinkActive="active"
                class="dropdown-item"
                (click)="closeDropdowns(); closeMobileMenu()"
              >
                Projects
              </a>
            </li>
            <li>
              <a
                routerLink="/gallery"
                routerLinkActive="active"
                class="dropdown-item"
                (click)="closeDropdowns(); closeMobileMenu()"
              >
            Gallery
              </a>
            </li>

<!--            <li>
              <a
                routerLink="/our-impact"
                routerLinkActive="active"
                class="dropdown-item"
                (click)="closeDropdowns(); closeMobileMenu()"
              >
                Our Impact
              </a>
            </li>-->

            <li>
              <a
                routerLink="/support-us"
                routerLinkActive="active"
                class="dropdown-item"
                (click)="closeDropdowns(); closeMobileMenu()"
              >
                Support Us
              </a>
            </li>
          </ul>
        </li>


        <!-- ===================================================== -->
        <!-- GET TO KNOW -->
        <!-- ===================================================== -->

        <li
          class="nav-item dropdown"
          [class.show]="isDropdownOpen('get-to-know')"
        >
          <a
            class="nav-link dropdown-toggle"
            role="button"
            [attr.aria-expanded]="isDropdownOpen('get-to-know')"
            (click)="toggleDropdown('get-to-know', $event)"
          >
            Get to Know
          </a>

          <ul
            class="dropdown-menu"
            [class.show]="isDropdownOpen('get-to-know')"
          >
            <li>
              <a
                routerLink="/islamic-resources"
                routerLinkActive="active"
                class="dropdown-item"
                (click)="closeDropdowns(); closeMobileMenu()"
              >
                Islamic Resources
              </a>
            </li>

            <li>
              <a
                routerLink="/prayer-times"
                routerLinkActive="active"
                class="dropdown-item"
                (click)="closeDropdowns(); closeMobileMenu()"
              >
                Prayer Times
              </a>
            </li>

            <li>
              <a
                routerLink="/islamic-calendar"
                routerLinkActive="active"
                class="dropdown-item"
                (click)="closeDropdowns(); closeMobileMenu()"
              >
                Islamic Calendar
              </a>
            </li>
          </ul>
        </li>


        <!-- Gallery -->
        <li class="nav-item">
          <a
            class="nav-link"
            routerLink="/madarasa"
            routerLinkActive="active"
            (click)="closeMobileMenu()"
          >
      Madarasa
          </a>
        </li>

<!--        &lt;!&ndash; Gallery &ndash;&gt;
        <li class="nav-item">
          <a
            class="nav-link"
            routerLink="/gallery"
            routerLinkActive="active"
            (click)="closeMobileMenu()"
          >
            Gallery
          </a>
        </li>-->

      </ul>
    </nav>

  </div>
</header>
